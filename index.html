<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F6; --surface:#FFFFFF; --ink:#18262F; --muted:#5A6B77; --line:#D6E0E6;
  --cool:#3B82B8; --warm:#E3962B; --hot:#D2553A; --alert:#B5462F; --alert-bg:#FBEAE4;
  --sky-sun:#FDF1D8; --sky-cloud:#E3E9EE; --sky-rain:#D9E4EE; --sky-storm:#D3D7E2; --sky-snow:#EEF4F8; --sky-night:#DCE1EE;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1820; --surface:#16232D; --ink:#E5EDF2; --muted:#93A5B2; --line:#26353F;
    --cool:#6FB0E0; --warm:#F0B455; --hot:#EE7A5E; --alert:#F29A80; --alert-bg:#3A221C;
    --sky-sun:#2E2817; --sky-cloud:#1D2A33; --sky-rain:#172A3A; --sky-storm:#1E2034; --sky-snow:#1F2D38; --sky-night:#1A2036;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1820; --surface:#16232D; --ink:#E5EDF2; --muted:#93A5B2; --line:#26353F;
  --cool:#6FB0E0; --warm:#F0B455; --hot:#EE7A5E; --alert:#F29A80; --alert-bg:#3A221C;
  --sky-sun:#2E2817; --sky-cloud:#1D2A33; --sky-rain:#172A3A; --sky-storm:#1E2034; --sky-snow:#1F2D38; --sky-night:#1A2036;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1,h2,.num{font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif}
.search{position:relative;margin:4px 0 10px}
.search input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 42px}
.search input:focus-visible{outline:3px solid var(--cool);outline-offset:1px}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--muted)}
.results{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:-4px 0 12px;overflow:hidden}
.results button{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;cursor:pointer}
.results button:first-child{border-top:0}
.results small{color:var(--muted)}
.results p{margin:0;padding:12px 14px;color:var(--muted)}
.req{color:var(--cool)!important;font-weight:700}
.label{font-size:14px;color:var(--muted);margin-top:10px}
.cities{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.cities::-webkit-scrollbar{display:none}
.city-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.city-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.city-btn:focus-visible,button:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
.hero{border-radius:28px;padding:24px 22px 22px;background:var(--sky-cloud);transition:background .6s}
.hero[data-sky="sun"]{background:var(--sky-sun)}
.hero[data-sky="rain"]{background:var(--sky-rain)}
.hero[data-sky="storm"]{background:var(--sky-storm)}
.hero[data-sky="snow"]{background:var(--sky-snow)}
.hero[data-sky="night"]{background:var(--sky-night)}
.place{margin:0;font-size:22px;font-weight:600;line-height:1.2}
.region{color:var(--muted);font-size:15px}
.now{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.temp{font-size:clamp(84px,26vw,124px);font-weight:800;line-height:.9;letter-spacing:-.04em}
.temp sup{font-size:.35em;font-weight:600;vertical-align:.95em;letter-spacing:0}
.big-icon{width:96px;height:96px;flex:0 0 auto}
.cond{font-size:20px;margin:8px 0 2px}
.hilo{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.fact{background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:14px;padding:10px 12px}
.fact b{display:block;font-size:18px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600}
.fact span{color:var(--muted);font-size:13px}
.alert{margin-top:14px;background:var(--alert-bg);color:var(--alert);border-radius:16px;padding:12px 14px}
.alert strong{display:block}
.alert p{margin:2px 0 0;color:var(--ink);font-size:15px}
.section{margin-top:22px}
.section h2{font-size:17px;font-weight:600;margin:0 0 8px}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.hour{flex:0 0 64px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.hour .t{font-size:13px;color:var(--muted)}
.hour svg{width:28px;height:28px;margin:4px auto;display:block}
.hour .v{font-weight:700}
.hour .r{font-size:12px;color:var(--cool);min-height:1.2em}
.days{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 14px}
.day{display:grid;grid-template-columns:52px 28px 40px 1fr 44px 36px;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .d{font-weight:700;white-space:nowrap}
.conf{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:5px;vertical-align:1px;border:2px solid var(--muted)}
.conf-high{background:var(--cool);border-color:var(--cool)}
.conf-medium{background:linear-gradient(90deg,var(--warm) 50%,transparent 50%);border-color:var(--warm)}
.conf-low{background:transparent;border-color:var(--hot)}
.legend{color:var(--muted);font-size:13px;margin:8px 2px 0;display:flex;gap:14px;flex-wrap:wrap}
.legend .conf{margin:0 5px 0 0}
.agree{margin-top:12px;font-size:15px}
.agree b{font-weight:700}
.day svg{width:26px;height:26px}
.day .lo{color:var(--muted);text-align:right}
.day .hi{font-weight:700}
.day .rain{font-size:13px;color:var(--cool);text-align:right}
.track{height:6px;border-radius:6px;background:var(--line);position:relative}
.bar{position:absolute;top:0;bottom:0;border-radius:6px}
.meta{margin-top:18px;color:var(--muted);font-size:14px}
.meta .stale{color:var(--alert);font-weight:700}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:24px;padding:28px 22px;text-align:center}
.empty h1{font-size:26px;margin:0 0 6px}
.empty p{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.hero{transition:none}}
.near{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.near p{margin:0}
.near-note{color:var(--muted);font-size:14px;margin-top:6px!important}
.req-btn{margin-top:10px;font:inherit;font-weight:700;color:var(--bg);background:var(--cool);border:0;border-radius:12px;padding:10px 14px;cursor:pointer}
.req-btn:disabled{opacity:.6}
.radars{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.radar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.radar:first-child{border-top:0}
.radar small{display:block;color:var(--muted);font-size:13px}
.radar .go{color:var(--cool);font-weight:700;white-space:nowrap}
.radar:focus-visible{outline:3px solid var(--cool);outline-offset:-3px}
#map{height:320px;border-radius:20px;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.radar-bar{display:flex;align-items:center;gap:12px;margin-top:8px}
.radar-bar button{font:inherit;font-weight:700;color:var(--bg);background:var(--cool);border:0;border-radius:10px;padding:6px 12px;cursor:pointer}
#rtime{color:var(--muted);font-size:14px}
.coverage{color:var(--muted);font-size:14px;margin:0 2px 10px}
</style>

  function loadRadar(){
    if(!window.L||!window.fetch) return;
    fetch('https://api.rainviewer.com/public/weather-maps.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.radar||!d.radar.past||!d.radar.past.length) return;
      document.getElementById('radar-live').hidden=false;
      if(!RV.map){
        RV.map=L.map('map',{scrollWheelZoom:false,maxZoom:11,minZoom:4}).setView([RV.lat,RV.lon],8);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:11,attribution:'© OpenStreetMap'}).addTo(RV.map);
        RV.marker=L.circleMarker([RV.lat,RV.lon],{radius:6,color:'#fff',weight:2,fillColor:'#D2553A',fillOpacity:1}).addTo(RV.map);
      }
      if(d.generated===RV.gen) return; RV.gen=d.generated;
      RV.layers.forEach(function(l){ RV.map.removeLayer(l); });
      RV.frames=d.radar.past.slice(-6);
      RV.layers=RV.frames.map(function(f){ return L.tileLayer(d.host+f.path+'/256/{z}/{x}/{y}/2/1_1.png',{opacity:0,maxNativeZoom:7,maxZoom:11,zIndex:10,attribution:'Radar © RainViewer'}).addTo(RV.map); });
      RV.i=RV.frames.length-1; showFrame(RV.i); clearTimeout(RV.anim); RV.anim=setTimeout(animate,2000);
    }).catch(function(){});
  }
  document.getElementById('rplay').onclick=function(){ RV.playing=!RV.playing; this.textContent=RV.playing?'Pause':'Play'; if(RV.playing) animate(); else { RV.i=RV.frames.length-1; showFrame(RV.i); } };
  setInterval(loadRadar, 10*60*1000);

  document.getElementById('count').textContent = TOWNS.length.toLocaleString('en-AU');
  select(location.hash.slice(1));
  loadRadar();

  if(window.claude && window.claude.use){
    window.claude.use('db').then(function(db){ dbRef=db||null; }).catch(function(){});
  }
})();

</script>
</body>
</html>
